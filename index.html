<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Background Colour Switcher</title>
</head>
<body>
    <div class="colorpicker">
        <h1>Background Colour Switcher</h1>

        <span class="Block" id="purple"></span>
        <span class="Block" id="yellow"></span>
        <span class="Block" id="red"></span>
        <span class="Block" id="blue"></span>
        <span class="Block" id="grey"></span>


        <h2>
            Try clicking on any block above <br><br>
            <span>To change the background color of the page</span>
        </h2>

        <h2 id="messageBox"></h2>
    </div>

    <script src="colourSwitcher.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover Playground</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Hover Playground</h1>
      <p class="subtitle">Move your mouse inside the yellow box</p>
      <div class="top-bar">
        <h2>Hover Count: <span id="count">0</span></h2>
        <div class="buttons">
          <button id="resetBtn">Reset</button>
          <button id="themeBtn">Dark Mode</button>
        </div>
      </div>
      <div id="yellowDiv"></div>
    </div>
  </body>

  <script src="index.js"></script>
</html>

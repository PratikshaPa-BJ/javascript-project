<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Background Colour Changer Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Random Background Colour Changer</h2>

    <button id="start">Start</button>
    <button id="stop">Stop</button>

    <p id="colorCode">Color: #FFFFFF</p>

    <div class="controls">
      <input type="range" id="delay" min="200" max="2000" value="1000" />
      <p>timeDelay: <span id="delayVal">1000</span> ms</p>
    </div>
  </body>

  <script src="randombgChanger.js"></script>
</html>
